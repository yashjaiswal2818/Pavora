<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pavora">
  <defs>
    <linearGradient id="iris" x1="7" y1="7" x2="25" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3bef8a" />
      <stop offset="0.38" stop-color="#23e0d2" />
      <stop offset="0.7" stop-color="#5b7bff" />
      <stop offset="1" stop-color="#d65cff" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.34" cy="0.3" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- the iridescent peacock / Pavo bead: the brand's one spot of colour -->
  <circle cx="16" cy="16" r="13" fill="url(#iris)" />
  <circle cx="16" cy="16" r="13" fill="url(#sheen)" />
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#000000" stroke-opacity="0.14" stroke-width="1" />
</svg>
